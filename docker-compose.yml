services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-mis
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      BACKEND_PORT: ${BACKEND_PORT:-5000}
      USE_REAL_DB: "true"
    volumes:
      # 持久化上传的图片、PDF 说明书、QA 文档
      - ./backend/public/uploads:/app/backend/public/uploads
    extra_hosts:
      # 方便容器访问宿主机上的 MySQL（在 .env 中设置 DB_HOST=host.docker.internal）
      - "host.docker.internal:host-gateway"
